[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/directions"
  to = "/.netlify/functions/directions"
  status = 200

[[redirects]]
  from = "/taiwan_home_stores_dashboard.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
