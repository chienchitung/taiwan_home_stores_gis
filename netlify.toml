[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/directions"
  to = "/.netlify/functions/directions"
  status = 200

[[redirects]]
  from = "/taiwan_home_stores_dashboard.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

# 第三方函式庫（Leaflet）版本固定，讓手機重新整理時不必每次都回伺服器確認
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# 網址帶內容雜湊版本號（?v=...）的檔案：內容變了網址就變，可長期快取
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/stores_data.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
